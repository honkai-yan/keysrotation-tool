[package]
name = "rust_keyrotation"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64 = "0.23.1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
egui = "0.37.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["blocking"] }
rusqlite = { version = "0.41.1", features = ["bundled", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
